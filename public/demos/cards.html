<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Cards</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: #0e100f;
        color: #fff;
        font-family: Inter, Arial, sans-serif;
      }

      main {
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: flex-end;
        padding: clamp(24px, 5vw, 64px);
      }

      .cards-row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        align-items: end;
        gap: clamp(12px, 1.5vw, 20px);
        width: min(1200px, 100%);
        margin: 0 auto;
      }

      .card {
        position: relative;
        width: 100%;
        min-width: 0;
        height: clamp(260px, 36vw, 420px);
        overflow: hidden;
        border-radius: 0;
        color: #fff;
        cursor: none;
        user-select: none;
        box-shadow: none;
        transform-origin: bottom center;
        will-change: height;
      }

      .flair {
        width: 72px;
        height: 72px;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: #fff;
        color: #0e100f;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
      }

      .flair svg {
        width: 22px;
        height: 22px;
        display: block;
      }

      .card:focus-visible {
        outline: 2px solid #abff84;
        outline-offset: 4px;
      }

      .card::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.05) 30%,
          rgba(0, 0, 0, 0.72) 100%
        );
        pointer-events: none;
      }

      .card__image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .card__title {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 2;
        margin: 0;
        padding: clamp(18px, 2.5vw, 28px);
        font-size: clamp(1.5rem, 2.4vw, 2.5rem);
        font-weight: 500;
        letter-spacing: -0.05em;
        line-height: 0.95;
        white-space: nowrap;
        pointer-events: none;
      }

      @media (max-width: 720px) {
        main {
          align-items: center;
        }

        .cards-row {
          grid-template-columns: 1fr;
          width: 100%;
        }

        .card {
          height: 320px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="cards-row" aria-label="Featured projects">
        <article class="card" role="button" tabindex="0" aria-label="Form in motion">
          <img
            class="card__image"
            src="https://assets.codepen.io/16327/portrait-image-5.jpg"
            alt=""
          />
          <h2 class="card__title">Form in motion</h2>
        </article>

        <article class="card" role="button" tabindex="0" aria-label="Quiet energy">
          <img
            class="card__image"
            src="https://assets.codepen.io/16327/portrait-image-1.jpg"
            alt=""
          />
          <h2 class="card__title">Quiet energy</h2>
        </article>

        <article class="card" role="button" tabindex="0" aria-label="New perspective">
          <img
            class="card__image"
            src="https://assets.codepen.io/16327/portrait-image-11.jpg"
            alt=""
          />
          <h2 class="card__title">New perspective</h2>
        </article>
      </section>
    </main>

    <div class="flair flair--3" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M5 12h14M13 6l6 6-6 6"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/CustomEase.min.js"></script>
    <script>
      gsap.registerPlugin(CustomEase);
      CustomEase.create("osmo", "M0,0 C0.32,0.72 0,1 1,1");
      CustomEase.create("osmoSettle", "M0,0 C0.16,1 0.3,1 1,1");

      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;
      const flair = document.querySelector(".flair");
      const row = document.querySelector(".cards-row");
      const cards = gsap.utils.toArray(".card");
      const isMobile = () => window.matchMedia("(max-width: 720px)").matches;

      // Numeric column weights — tweening these stays smooth between rapid presses.
      const col = { c0: 1, c1: 1, c2: 1 };
      const heightTargets = cards.map(() => 0);
      const restingHeights = cards.map((card) => {
        card.style.height = "";
        return card.offsetHeight || 360;
      });
      const cardStates = cards.map(() => "rest"); // rest | hover | press
      let pressedIndex = -1;
      let columnsTween = null;

      cards.forEach((card, i) => {
        heightTargets[i] = restingHeights[i];
        gsap.set(card, { height: restingHeights[i] });
      });
      gsap.set(flair, { xPercent: -50, yPercent: -50, scale: 0, autoAlpha: 0 });
      applyColumns(true);

      const pointer = { x: 0, y: 0 };
      const xTo = gsap.quickTo(flair, "x", { duration: 0.6, ease: "osmo" });
      const yTo = gsap.quickTo(flair, "y", { duration: 0.6, ease: "osmo" });

      window.addEventListener("pointermove", (e) => {
        pointer.x = e.clientX;
        pointer.y = e.clientY;
        xTo(e.clientX);
        yTo(e.clientY);
      });

      function showFlair() {
        gsap.killTweensOf(flair, "scale,autoAlpha");
        gsap.to(flair, {
          scale: 1,
          autoAlpha: 1,
          duration: 0.35,
          ease: "osmoSettle",
        });
      }

      function hideFlair() {
        gsap.killTweensOf(flair, "scale,autoAlpha");
        gsap.to(flair, {
          scale: 0,
          autoAlpha: 0,
          duration: 0.25,
          ease: "osmo",
        });
      }

      function cardIndexUnderPointer() {
        const el = document.elementFromPoint(pointer.x, pointer.y);
        if (!el) return -1;
        return cards.findIndex((card) => card.contains(el));
      }

      function syncFlairToPointer() {
        if (cardIndexUnderPointer() >= 0 || pressedIndex !== -1) {
          showFlair();
        } else {
          hideFlair();
        }
      }

      function applyColumns(immediate = false) {
        const value = isMobile()
          ? "1fr"
          : `${col.c0}fr ${col.c1}fr ${col.c2}fr`;
        if (immediate) {
          gsap.set(row, { gridTemplateColumns: value });
          return;
        }
        gsap.set(row, { gridTemplateColumns: value });
      }

      function hoverHeight(i) {
        return restingHeights[i] * 1.18;
      }

      function pressHeight(i) {
        return restingHeights[i] * 1.08;
      }

      function animateColumns(index, duration = 0.55) {
        if (columnsTween) columnsTween.kill();

        const target =
          isMobile() || index < 0
            ? { c0: 1, c1: 1, c2: 1 }
            : {
                c0: index === 0 ? 0.9 : 1.05,
                c1: index === 1 ? 0.9 : 1.05,
                c2: index === 2 ? 0.9 : 1.05,
              };

        columnsTween = gsap.to(col, {
          ...target,
          duration,
          ease: "osmo",
          overwrite: true,
          onUpdate: () => applyColumns(),
        });
      }

      function animateHeight(index, height, duration = 0.55) {
        heightTargets[index] = height;
        gsap.to(cards[index], {
          height,
          duration,
          ease: "osmo",
          overwrite: "auto",
        });
      }

      function setCardVisual(index, nextState, duration = 0.55) {
        cardStates[index] = nextState;
        const height =
          nextState === "press"
            ? pressHeight(index)
            : nextState === "hover"
              ? hoverHeight(index)
              : restingHeights[index];
        animateHeight(index, height, duration);
      }

      function pressCard(index) {
        // Softly unwind the previously pressed card into hover.
        if (pressedIndex !== -1 && pressedIndex !== index) {
          setCardVisual(pressedIndex, "hover", 0.55);
        }

        pressedIndex = index;
        setCardVisual(index, "press", 0.55);
        animateColumns(index, 0.55);
        showFlair();
      }

      function releaseCard(index) {
        if (pressedIndex === index) {
          pressedIndex = -1;
          animateColumns(-1, 0.55);
        }

        // Decide from live pointer position so click/cancel never drops the cursor
        // just because capture/layout briefly desynced hit-testing.
        const under = cardIndexUnderPointer();

        if (under === index) {
          setCardVisual(index, "hover", 0.55);
          showFlair();
          return;
        }

        setCardVisual(index, "rest", 0.55);

        if (under >= 0) {
          setCardVisual(under, "hover", 0.55);
          showFlair();
          return;
        }

        syncFlairToPointer();
      }



      window.addEventListener("resize", () => {
        cards.forEach((card, i) => {
          const prev = card.style.height;
          card.style.height = "";
          restingHeights[i] = card.offsetHeight || 360;
          card.style.height = prev;
          const state = cardStates[i];
          const height =
            state === "press"
              ? pressHeight(i)
              : state === "hover"
                ? hoverHeight(i)
                : restingHeights[i];
          gsap.set(card, { height });
        });
        applyColumns(true);
      });

      if (!reducedMotion) {
        cards.forEach((card, index) => {
          let releaseTimer = null;

          const clearReleaseTimer = () => {
            if (releaseTimer) {
              clearTimeout(releaseTimer);
              releaseTimer = null;
            }
          };

          card.addEventListener("pointerenter", () => {
            if (cardStates[index] === "press") return;
            showFlair();
            setCardVisual(index, "hover", 0.55);
          });

          card.addEventListener("pointerleave", () => {
            if (cardStates[index] === "press") return;
            clearReleaseTimer();
            setCardVisual(index, "rest", 0.55);
            // Wait a frame so entering another card can win before we hide.
            requestAnimationFrame(syncFlairToPointer);
          });

          card.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            clearReleaseTimer();
            pointer.x = event.clientX;
            pointer.y = event.clientY;
            try {
              card.setPointerCapture(event.pointerId);
            } catch (_) {}
            pressCard(index);
            showFlair();
          });

          const handleRelease = (event) => {
            if (cardStates[index] !== "press" && pressedIndex !== index) return;
            clearReleaseTimer();

            if (event) {
              pointer.x = event.clientX;
              pointer.y = event.clientY;
            }

            if (event?.pointerId != null && card.hasPointerCapture?.(event.pointerId)) {
              try {
                card.releasePointerCapture(event.pointerId);
              } catch (_) {}
            }

            releaseCard(index);
          };

          card.addEventListener("pointerup", handleRelease);
          card.addEventListener("pointercancel", handleRelease);
          // Don't release here — capture loss after pointerup was forcing
          // stillOver=false and hiding the cursor on every click.
          card.addEventListener("lostpointercapture", () => {
            if (cardStates[index] !== "press") {
              syncFlairToPointer();
            }
          });

          card.addEventListener("focus", () => {
            showFlair();
            setCardVisual(index, "hover", 0.55);
          });

          card.addEventListener("blur", () => {
            clearReleaseTimer();
            if (pressedIndex === index) pressedIndex = -1;
            setCardVisual(index, "rest", 0.55);
            animateColumns(pressedIndex, 0.55);
            syncFlairToPointer();
          });

          card.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              pressCard(index);
            }
          });

          card.addEventListener("keyup", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              releaseCard(index);
            }
          });
        });
      }
    </script>
    <script src="./osmos-motion.js" defer></script>
</body>
</html>
