<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Glass Sidebar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14301c;
        overflow: hidden;
        font-family: Inter, sans-serif;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .sidebar {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 2;
        width: min(340px, calc(100vw - 48px));
        margin: 0;
        padding: 14px;
        border-radius: 28px;
        transform: translate(-50%, -50%);
      }

      .pill {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 0;
        border-radius: 16px;
        pointer-events: none;
        will-change: top, height, opacity;
      }

      .pill--hover {
        background: rgba(255, 255, 255, 0.14);
        opacity: 0;
        visibility: hidden;
      }

      .pill--active {
        background: rgba(255, 255, 255, 0.22);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
      }

      .sidebar button {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        margin: 0;
        padding: 12px 14px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(255, 255, 255, 0.72);
        font: inherit;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: -0.02em;
        text-align: left;
        cursor: pointer;
        transition: color 0.22s ease;
      }

      .sidebar button:hover,
      .sidebar button[aria-current="page"] {
        color: #ffffff;
      }

      .sidebar svg {
        width: 22px;
        height: 22px;
        flex: 0 0 auto;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/CustomEase.min.js"></script>
    <nav class="sidebar" id="sidebar" aria-label="Sidebar">
      <span class="pill pill--hover" id="hover-pill" aria-hidden="true"></span>
      <span class="pill pill--active" id="active-pill" aria-hidden="true"></span>
      <button type="button" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z" /></svg>
        Dashboard
      </button>
      <button type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" /><path d="m20 20-3.5-3.5" /></svg>
        Search
      </button>
      <button type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M8 16v-5M12 16V8M16 16v-3" /></svg>
        Sales Analytics
      </button>
      <button type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V10a6 6 0 1 1 12 0v6l1.5 2h-15zM10 19a2 2 0 0 0 4 0" /></svg>
        Notification
      </button>
      <button type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4" /></svg>
        Account Settings
      </button>
    </nav>
    <script type="module">
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

      const CAMERA_Z = 5;
      const canvas = document.getElementById("scene");
      const sidebar = document.getElementById("sidebar");
      const buttons = [...sidebar.querySelectorAll("button")];
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.toneMapping = THREE.NoToneMapping;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
      camera.position.z = CAMERA_Z;

      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      pmrem.dispose();

      const backdrop = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1),
        new THREE.MeshBasicMaterial({ color: 0x14301c, toneMapped: false })
      );
      scene.add(backdrop);

      function roundedRectGeometry(worldW, worldH, worldR, depth) {
        const radius = Math.min(worldR, worldH / 2 - 0.001, worldW / 2 - 0.001);
        const shape = new THREE.Shape();
        const halfW = worldW / 2;
        const halfH = worldH / 2;
        shape.moveTo(-halfW + radius, -halfH);
        shape.lineTo(halfW - radius, -halfH);
        shape.quadraticCurveTo(halfW, -halfH, halfW, -halfH + radius);
        shape.lineTo(halfW, halfH - radius);
        shape.quadraticCurveTo(halfW, halfH, halfW - radius, halfH);
        shape.lineTo(-halfW + radius, halfH);
        shape.quadraticCurveTo(-halfW, halfH, -halfW, halfH - radius);
        shape.lineTo(-halfW, -halfH + radius);
        shape.quadraticCurveTo(-halfW, -halfH, -halfW + radius, -halfH);
        const geometry = new THREE.ExtrudeGeometry(shape, {
          depth,
          bevelEnabled: true,
          bevelSegments: 6,
          steps: 1,
          bevelSize: Math.min(0.04, radius * 0.4),
          bevelThickness: Math.min(0.05, depth),
          curveSegments: 12,
        });
        geometry.center();
        return geometry;
      }

      function glassMaterial() {
        return new THREE.MeshPhysicalMaterial({
          color: 0xffffff,
          metalness: 0,
          roughness: 0.03,
          transmission: 1,
          thickness: 1.35,
          ior: 1.4,
          dispersion: 6,
          envMapIntensity: 1.55,
          clearcoat: 1,
          clearcoatRoughness: 0.08,
          toneMapped: false,
        });
      }

      const panel = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 0.1), glassMaterial());
      panel.position.z = 1.3;
      scene.add(panel);

      new THREE.TextureLoader().load("/images/placeholders/04.jpg", (texture) => {
        texture.colorSpace = THREE.SRGBColorSpace;
        backdrop.material.map = texture;
        backdrop.material.needsUpdate = true;
      });

      let viewW = 0;
      let viewH = 0;

      function worldSize(z) {
        const distance = CAMERA_Z - z;
        const visibleHeight = 2 * distance * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
        return { visibleHeight, visibleWidth: visibleHeight * camera.aspect };
      }

      function placeMesh(mesh, rect, radiusPx, z) {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const { visibleWidth, visibleHeight } = worldSize(z);
        mesh.geometry.dispose();
        mesh.geometry = roundedRectGeometry(
          (rect.width / width) * visibleWidth,
          (rect.height / height) * visibleHeight,
          (radiusPx / height) * visibleHeight,
          z > 1.4 ? 0.05 : 0.12
        );
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        mesh.position.set(
          ((cx / width) * 2 - 1) * (visibleWidth / 2),
          (1 - (cy / height) * 2) * (visibleHeight / 2),
          z
        );
      }

      function sync() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        if (width !== viewW || height !== viewH) {
          viewW = width;
          viewH = height;
          renderer.setSize(width, height);
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
        }
        const { visibleWidth, visibleHeight } = worldSize(0);
        backdrop.scale.set(visibleWidth, visibleHeight, 1);
        placeMesh(panel, sidebar.getBoundingClientRect(), 28, 1.3);
      }

      gsap.registerPlugin(CustomEase);
      CustomEase.create("slide", "0.77, 0, 0.18, 1");
      CustomEase.create("hover", "0.4, 0, 0.2, 1");

      const hoverPill = document.getElementById("hover-pill");
      const activePill = document.getElementById("active-pill");
      const hoverPos = { top: 0, bottom: 0 };
      const activePos = { top: 0, bottom: 0 };

      function paint(el, pos) {
        gsap.set(el, { top: pos.top, height: Math.max(0, pos.bottom - pos.top) });
      }

      function stretch(el, pos, item) {
        const targetTop = item.offsetTop;
        const targetBottom = targetTop + item.offsetHeight;
        const visible = Number(gsap.getProperty(el, "opacity")) > 0.05;
        gsap.to(el, { autoAlpha: 1, duration: 0.18, ease: "power2.out", overwrite: "auto" });
        if (!visible) {
          pos.top = targetTop;
          pos.bottom = targetBottom;
          paint(el, pos);
          return;
        }
        gsap.killTweensOf(pos);
        const duration = el === activePill ? 0.55 : 0.32;
        gsap.to(pos, {
          top: targetTop,
          bottom: targetBottom,
          duration,
          ease: el === activePill ? "slide" : "hover",
          onUpdate: () => paint(el, pos),
          overwrite: "auto",
        });
        if (el === activePill) {
          gsap.killTweensOf(el, "scaleX");
          gsap.fromTo(
            el,
            { scaleX: 1 },
            {
              scaleX: 0.975,
              duration: duration / 2,
              ease: "slide",
              yoyo: true,
              repeat: 1,
              overwrite: "auto",
            }
          );
        }
      }

      activePos.top = buttons[0].offsetTop;
      activePos.bottom = buttons[0].offsetTop + buttons[0].offsetHeight;
      paint(activePill, activePos);

      buttons.forEach((button) => {
        button.addEventListener("pointerenter", () => {
          if (button.getAttribute("aria-current") === "page") {
            gsap.to(hoverPill, { autoAlpha: 0, duration: 0.16, overwrite: "auto" });
            return;
          }
          stretch(hoverPill, hoverPos, button);
        });
        button.addEventListener("pointerdown", () => {
          gsap.to(button, { scale: 0.96, duration: 0.12, ease: "power2.out", overwrite: "auto" });
        });
        const release = () => {
          gsap.to(button, { scale: 1, duration: 0.34, ease: "slide", overwrite: "auto" });
        };
        button.addEventListener("pointerup", release);
        button.addEventListener("pointerleave", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("click", () => {
          buttons.forEach((item) => item.removeAttribute("aria-current"));
          button.setAttribute("aria-current", "page");
          gsap.to(hoverPill, { autoAlpha: 0, duration: 0.16, overwrite: "auto" });
          stretch(activePill, activePos, button);
        });
      });

      sidebar.addEventListener("pointerleave", () => {
        gsap.to(hoverPill, { autoAlpha: 0, duration: 0.2, ease: "power2.out", overwrite: "auto" });
      });

      function render() {
        sync();
        renderer.render(scene, camera);
        requestAnimationFrame(render);
      }

      render();
    </script>
  </body>
</html>
