<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service Hover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #ffffff;
        color: #0a0a0a;
        font-family: Inter, sans-serif;
        letter-spacing: -0.03em;
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 48px 32px;
      }

      .services-grid {
        width: min(1050px, 100%);
        display: grid;
        grid-template-columns: 1fr 1.15fr;
        gap: 70px;
        align-items: center;
      }

      .services-menu-wrapper {
        position: relative;
        padding-left: 20px;
      }

      .hover-backdrop {
        position: absolute;
        left: 12px;
        right: 0;
        top: 0;
        height: 0;
        background: #f4f4f6;
        border-radius: 12px;
        pointer-events: none;
        z-index: 0;
      }

      .active-indicator {
        position: absolute;
        left: 0;
        top: 0;
        width: 4px;
        height: 0;
        background: #000000;
        border-radius: 4px;
        z-index: 2;
      }

      .services-list {
        position: relative;
        z-index: 1;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .service-item {
        padding: 24px 20px;
        border: 0;
        border-radius: 12px;
        cursor: pointer;
        user-select: none;
        outline: none;
      }

      .service-item__content {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .service-item__number {
        font-size: 0.8rem;
        font-weight: 400;
        color: #a0a0a0;
      }

      .service-item__title {
        margin: 0;
        font-size: clamp(1.6rem, 2.8vw, 2.2rem);
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.15;
        color: #a0a0a0;
      }

      .service-item.is-active .service-item__title,
      .service-item.is-active .service-item__number {
        color: #0a0a0a;
      }

      .image-stage {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 3.2;
        border-radius: 20px;
        overflow: hidden;
        background: #000;
      }

      .image-strip {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }

      .image-slide {
        width: 100%;
        height: 100%;
        flex-shrink: 0;
        overflow: hidden;
      }

      .image-slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scale(1.06);
      }

      @media (max-width: 868px) {
        .services-grid {
          grid-template-columns: 1fr;
          gap: 36px;
        }

        .image-stage {
          order: -1;
          aspect-ratio: 16 / 10;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="services-grid" id="root">
        <div class="services-menu-wrapper">
          <div class="hover-backdrop" aria-hidden="true"></div>
          <div class="active-indicator" aria-hidden="true"></div>
          <ul class="services-list">
            <li class="service-item is-active" data-index="0" tabindex="0">
              <div class="service-item__content">
                <span class="service-item__number">(01)</span>
                <h3 class="service-item__title">Web Design</h3>
              </div>
            </li>
            <li class="service-item" data-index="1" tabindex="0">
              <div class="service-item__content">
                <span class="service-item__number">(02)</span>
                <h3 class="service-item__title">Framer Development</h3>
              </div>
            </li>
            <li class="service-item" data-index="2" tabindex="0">
              <div class="service-item__content">
                <span class="service-item__number">(03)</span>
                <h3 class="service-item__title">Branding</h3>
              </div>
            </li>
          </ul>
        </div>

        <div class="image-stage">
          <div class="image-strip">
            <div class="image-slide">
              <img
                src="/images/placeholders/01.jpg"
                alt="Web Design"
              />
            </div>
            <div class="image-slide">
              <img
                src="/images/placeholders/02.jpg"
                alt="Framer Development"
              />
            </div>
            <div class="image-slide">
              <img
                src="/images/placeholders/03.jpg"
                alt="Branding"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script>
      const EASE_FAST_FLUID = "cubic-bezier(0.16, 1, 0.3, 1)";
      const EASE_LEAD_STRETCH = "cubic-bezier(0.22, 1, 0.36, 1)";
      const EASE_ELASTIC_SNAP = "cubic-bezier(0.34, 1.25, 0.64, 1)";

      const root = document.getElementById("root");
      const items = gsap.utils.toArray(".service-item", root);
      const images = gsap.utils.toArray(".image-slide img", root);
      const strip = root.querySelector(".image-strip");
      const indicator = root.querySelector(".active-indicator");
      const backdrop = root.querySelector(".hover-backdrop");
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let activeIndex = 0;
      const linePos = { top: 0, bottom: 0 };
      const bgPos = { top: 0, bottom: 0 };

      const renderIndicator = () => {
        gsap.set(indicator, {
          top: linePos.top,
          height: Math.max(0, linePos.bottom - linePos.top),
        });
      };

      const renderBackdrop = () => {
        gsap.set(backdrop, {
          top: bgPos.top,
          height: Math.max(0, bgPos.bottom - bgPos.top),
        });
      };

      const syncBounds = (index) => {
        const item = items[index];
        if (!item) return;
        const height = item.getBoundingClientRect().height;
        linePos.top = item.offsetTop;
        linePos.bottom = item.offsetTop + height;
        bgPos.top = item.offsetTop;
        bgPos.bottom = item.offsetTop + height;
        renderIndicator();
        renderBackdrop();
      };

      const updateActiveElements = (targetItem, isHovered = false) => {
        if (reduced) {
          syncBounds(parseInt(targetItem.dataset.index, 10));
          return;
        }

        const targetTop = targetItem.offsetTop;
        const targetBottom = targetTop + targetItem.getBoundingClientRect().height;
        const isMovingDown = targetTop > linePos.top;

        gsap.to(indicator, {
          width: isHovered ? 5 : 4,
          duration: 0.22,
          ease: EASE_FAST_FLUID,
          overwrite: "auto",
        });

        if (isMovingDown) {
          gsap.to(linePos, {
            bottom: targetBottom,
            duration: 0.26,
            ease: EASE_LEAD_STRETCH,
            onUpdate: renderIndicator,
            overwrite: "auto",
          });
          gsap.to(bgPos, {
            bottom: targetBottom,
            duration: 0.28,
            ease: EASE_LEAD_STRETCH,
            onUpdate: renderBackdrop,
            overwrite: "auto",
          });
          gsap.to(linePos, {
            top: targetTop,
            duration: 0.38,
            ease: EASE_ELASTIC_SNAP,
            onUpdate: renderIndicator,
            overwrite: "auto",
          });
          gsap.to(bgPos, {
            top: targetTop,
            duration: 0.4,
            ease: EASE_ELASTIC_SNAP,
            onUpdate: renderBackdrop,
            overwrite: "auto",
          });
        } else {
          gsap.to(linePos, {
            top: targetTop,
            duration: 0.26,
            ease: EASE_LEAD_STRETCH,
            onUpdate: renderIndicator,
            overwrite: "auto",
          });
          gsap.to(bgPos, {
            top: targetTop,
            duration: 0.28,
            ease: EASE_LEAD_STRETCH,
            onUpdate: renderBackdrop,
            overwrite: "auto",
          });
          gsap.to(linePos, {
            bottom: targetBottom,
            duration: 0.38,
            ease: EASE_ELASTIC_SNAP,
            onUpdate: renderIndicator,
            overwrite: "auto",
          });
          gsap.to(bgPos, {
            bottom: targetBottom,
            duration: 0.4,
            ease: EASE_ELASTIC_SNAP,
            onUpdate: renderBackdrop,
            overwrite: "auto",
          });
        }
      };

      const scrollToImage = (targetIndex) => {
        if (targetIndex === activeIndex) return;

        if (reduced) {
          gsap.set(strip, { yPercent: -(targetIndex * 100) });
          images.forEach((img, idx) => {
            gsap.set(img, { scale: idx === targetIndex ? 1 : 1.06 });
          });
          activeIndex = targetIndex;
          return;
        }

        gsap.to(strip, {
          yPercent: -(targetIndex * 100),
          duration: 0.32,
          ease: EASE_FAST_FLUID,
          overwrite: "auto",
        });

        images.forEach((img, idx) => {
          gsap.to(img, {
            scale: idx === targetIndex ? 1 : 1.06,
            duration: 0.36,
            ease: EASE_FAST_FLUID,
            overwrite: "auto",
          });
        });

        activeIndex = targetIndex;
      };

      syncBounds(0);
      gsap.set(indicator, { width: 4 });
      gsap.set(strip, { yPercent: 0 });
      gsap.set(images[0], { scale: 1 });

      items.forEach((item) => {
        const index = parseInt(item.dataset.index, 10);
        const content = item.querySelector(".service-item__content");

        const onEnter = () => {
          items.forEach((el) => el.classList.remove("is-active"));
          item.classList.add("is-active");
          updateActiveElements(item, true);
          scrollToImage(index);
          if (!reduced && content) {
            gsap.to(content, {
              x: 6,
              duration: 0.28,
              ease: EASE_FAST_FLUID,
              overwrite: "auto",
            });
          }
        };

        const onLeave = () => {
          if (!reduced && content) {
            gsap.to(content, {
              x: 0,
              duration: 0.28,
              ease: EASE_FAST_FLUID,
              overwrite: "auto",
            });
          }
          gsap.to(indicator, {
            width: 4,
            duration: 0.22,
            ease: EASE_FAST_FLUID,
            overwrite: "auto",
          });
        };

        item.addEventListener("mouseenter", onEnter);
        item.addEventListener("mouseleave", onLeave);
        item.addEventListener("focus", onEnter);
        item.addEventListener("blur", onLeave);
      });

      window.addEventListener("resize", () => syncBounds(activeIndex));
    </script>
  </body>
</html>
