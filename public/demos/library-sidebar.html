<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library Sidebar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f4f4f5;
        color: #111111;
        font-family: Inter, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px 20px;
      }

      .sidebar {
        width: min(248px, 100%);
        padding: 28px 20px 32px;
        background: #ffffff;
        border-radius: 24px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 4px 20px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.05em;
      }

      .brand svg {
        width: 16px;
        height: 16px;
      }

      .search {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 40px;
        margin: 0 0 24px;
        padding: 0 14px;
        border-radius: 999px;
        background: #f2f2f2;
        color: #8a8a8a;
      }

      .search svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      .search input {
        width: 100%;
        border: 0;
        background: transparent;
        outline: none;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: #111111;
      }

      .menu {
        position: relative;
      }

      .hover,
      .active {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 0;
        border-radius: 12px;
        pointer-events: none;
        z-index: 0;
        will-change: top, height, opacity, transform;
      }

      .hover {
        background: #e8e8ea;
        opacity: 0;
        visibility: hidden;
      }

      .active {
        background: #d8d8dc;
        transform-origin: 50% 50%;
      }

      .item {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-radius: 12px;
        background: none;
        font: inherit;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: -0.03em;
        color: #8a8a8a;
        text-align: left;
        cursor: pointer;
      }

      .item.is-active,
      .item.is-active .count {
        color: #111111;
      }

      .item:hover:not(.is-active) {
        color: #444444;
      }

      .item svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }

      .vault {
        font-weight: 600;
      }

      .cats {
        list-style: none;
        margin: 4px 0 0;
        padding: 0;
      }

      .count {
        width: 1.4em;
        opacity: 0.55;
        font-variant-numeric: tabular-nums;
      }

      .rule {
        height: 1px;
        margin: 12px;
        background: #ececec;
      }

      .badge {
        margin-left: auto;
        padding: 3px 8px;
        border-radius: 999px;
        background: #111111;
        font-size: 11px;
        font-style: normal;
        font-weight: 600;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <aside class="sidebar">
        <div class="brand">
          Uivolve
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path
              d="M10 1.4 11.7 7l5.9.2-4.6 3.6 1.6 5.6L10 13.2 5.4 16.4 7 10.8 2.4 7.2 8.3 7z"
              fill="currentColor"
            />
          </svg>
        </div>
        <label class="search">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.6" />
            <path d="M13 13l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <input type="search" placeholder="Search" aria-label="Search" />
        </label>
        <div class="menu">
          <div class="hover" aria-hidden="true"></div>
          <div class="active" aria-hidden="true"></div>
          <button class="item vault is-active" type="button" data-id="all">The Library</button>
          <ul class="cats">
            <li><button class="item" type="button" data-id="ui"><span class="count">08</span>UI</button></li>
            <li><button class="item" type="button" data-id="cards"><span class="count">07</span>Cards</button></li>
            <li><button class="item" type="button" data-id="nav"><span class="count">04</span>Navigation</button></li>
            <li><button class="item" type="button" data-id="anim"><span class="count">04</span>Animation</button></li>
          </ul>
          <div class="rule"></div>
          <button class="item" type="button" data-id="snippets">
            Snippets
            <em class="badge">New</em>
          </button>
          <button class="item" type="button" data-id="icons">Icons</button>
          <button class="item" type="button" data-id="learn">Learn</button>
        </div>
      </aside>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/CustomEase.min.js"></script>
    <script>
      gsap.registerPlugin(CustomEase);
      const SLIDE_EASE = CustomEase.create("sidebarSlide", "0.77, 0, 0.18, 1");
      const HOVER_EASE = CustomEase.create("sidebarHover", "0.4, 0, 0.2, 1");
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const menu = document.querySelector(".menu");
      const hoverEl = document.querySelector(".hover");
      const activeEl = document.querySelector(".active");
      const items = gsap.utils.toArray(".item");
      const hoverPos = { top: 0, bottom: 0 };
      const activePos = { top: 0, bottom: 0 };

      const paint = (el, pos) => {
        gsap.set(el, { top: pos.top, height: Math.max(0, pos.bottom - pos.top) });
      };

      const move = (el, pos, item, travel) => {
        const targetTop = item.offsetTop;
        const targetBottom = targetTop + item.offsetHeight;
        const visible = Number(gsap.getProperty(el, "opacity")) > 0.05;
        if (el === hoverEl) {
          gsap.to(el, { autoAlpha: 1, duration: reduced ? 0 : 0.16, ease: "power2.out", overwrite: "auto" });
        }
        if (reduced || !visible) {
          pos.top = targetTop;
          pos.bottom = targetBottom;
          paint(el, pos);
          gsap.set(el, { autoAlpha: 1, scaleX: 1 });
          return;
        }
        gsap.killTweensOf(pos);
        const duration = travel ? 0.55 : 0.32;
        gsap.to(pos, {
          top: targetTop,
          bottom: targetBottom,
          duration,
          ease: travel ? SLIDE_EASE : HOVER_EASE,
          onUpdate: () => paint(el, pos),
          overwrite: "auto",
        });
        if (travel) {
          gsap.killTweensOf(el, "scaleX");
          gsap.fromTo(el, { scaleX: 1 }, {
            scaleX: 0.975,
            duration: duration / 2,
            ease: SLIDE_EASE,
            yoyo: true,
            repeat: 1,
            overwrite: "auto",
          });
        }
      };

      const current = menu.querySelector(".item.is-active");
      if (current) {
        activePos.top = current.offsetTop;
        activePos.bottom = current.offsetTop + current.offsetHeight;
        paint(activeEl, activePos);
        gsap.set(activeEl, { autoAlpha: 1, scaleX: 1 });
      }
      gsap.set(hoverEl, { autoAlpha: 0 });

      items.forEach((item) => {
        item.addEventListener("pointerenter", () => {
          if (item.classList.contains("is-active")) {
            gsap.to(hoverEl, { autoAlpha: 0, duration: 0.16, overwrite: "auto" });
            return;
          }
          move(hoverEl, hoverPos, item, false);
        });
        item.addEventListener("pointerdown", () => {
          gsap.to(item, { scale: 0.96, duration: 0.12, ease: "power2.out", overwrite: "auto" });
        });
        item.addEventListener("pointerup", () => {
          gsap.to(item, { scale: 1, duration: 0.34, ease: SLIDE_EASE, overwrite: "auto" });
        });
        item.addEventListener("pointerleave", () => {
          gsap.to(item, { scale: 1, duration: 0.34, ease: SLIDE_EASE, overwrite: "auto" });
        });
        item.addEventListener("click", () => {
          if (item.classList.contains("is-active")) return;
          items.forEach((el) => el.classList.toggle("is-active", el === item));
          gsap.to(hoverEl, { autoAlpha: 0, duration: 0.16, overwrite: "auto" });
          move(activeEl, activePos, item, true);
        });
      });

      menu.addEventListener("pointerleave", () => {
        gsap.to(hoverEl, { autoAlpha: 0, duration: 0.2, ease: "power2.out", overwrite: "auto" });
      });
    </script>
  </body>
</html>
