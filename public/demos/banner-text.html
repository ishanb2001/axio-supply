<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banner Text CTA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000 url("/images/placeholders/01.jpg") center / cover no-repeat;
        color: #e8e8e8;
        font-family: Inter, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .banner {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: clamp(3rem, 8vh, 6rem) clamp(1.5rem, 5vw, 4rem);
      }

      .banner__headline {
        margin: 0;
        max-width: 14ch;
        font-size: clamp(3.25rem, 11vw, 7.5rem);
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 0.92;
        text-transform: uppercase;
        color: #ececec;
      }

      .banner__line {
        display: block;
        overflow: hidden;
      }

      .banner__line-inner {
        display: inline-block;
        will-change: transform, opacity;
      }

      .banner__ideas-row {
        display: flex;
        align-items: center;
        gap: 0;
        min-height: 1em;
      }

      .banner__avatars {
        display: flex;
        align-items: center;
        flex: 0 0 auto;
        width: 0;
        margin-right: 0;
        overflow: visible;
        will-change: width, margin-right;
      }

      .banner__avatar {
        width: clamp(2.4rem, 7vw, 4.75rem);
        height: clamp(2.4rem, 7vw, 4.75rem);
        border-radius: 50%;
        border: clamp(3px, 0.35vw, 5px) solid #000;
        object-fit: cover;
        background: #222;
        flex: 0 0 auto;
        transform: scale(0);
        opacity: 0;
        will-change: transform, opacity;
      }

      .banner__avatar + .banner__avatar {
        margin-left: calc(clamp(2.4rem, 7vw, 4.75rem) * -0.28);
      }

      .banner__ideas {
        display: inline-block;
        will-change: transform;
      }
    </style>
  </head>
  <body>
    <section class="banner">
      <h1 class="banner__headline">
        <span class="banner__line">
          <span class="banner__line-inner" data-line>Unlimited</span>
        </span>
        <span class="banner__line">
          <span class="banner__line-inner" data-line>Pretentious</span>
        </span>
        <span class="banner__line">
          <span class="banner__ideas-row">
            <span class="banner__avatars" data-avatars aria-hidden="true">
              <img
                class="banner__avatar"
                data-avatar
                src="/images/placeholders/02.jpg"
                alt=""
              />
              <img
                class="banner__avatar"
                data-avatar
                src="/images/placeholders/03.jpg"
                alt=""
              />
              <img
                class="banner__avatar"
                data-avatar
                src="/images/placeholders/04.jpg"
                alt=""
              />
            </span>
            <span class="banner__ideas" data-ideas data-line>Ideas</span>
          </span>
        </span>
      </h1>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/CustomEase.min.js"></script>
    <script>
      gsap.registerPlugin(CustomEase);
      CustomEase.create("osmo", "M0,0 C0.32,0.72 0,1 1,1");
      CustomEase.create("osmoSettle", "M0,0 C0.16,1 0.3,1 1,1");

      const lines = gsap.utils.toArray("[data-line]");
      const avatarsWrap = document.querySelector("[data-avatars]");
      const avatars = gsap.utils.toArray("[data-avatar]");
      const ideas = document.querySelector("[data-ideas]");

      const avatarSize = () => avatars[0].offsetWidth;
      const overlap = () => avatarSize() * 0.28;
      const avatarsTargetWidth = () =>
        avatarSize() * avatars.length - overlap() * (avatars.length - 1);
      const avatarsGap = () => Math.max(12, avatarSize() * 0.22);

      gsap.set(lines, { yPercent: 110, opacity: 0 });
      gsap.set(avatarsWrap, { width: 0, marginRight: 0 });
      gsap.set(avatars, { scale: 0, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set(ideas, { x: 0 });

      const tl = gsap.timeline({
        defaults: { ease: "osmo" },
        delay: 0.2,
      });

      tl.to(lines, {
        yPercent: 0,
        opacity: 1,
        duration: 1,
        stagger: 0.12,
      })
        .add("avatarsIn", "+=0.15")
        .to(
          avatarsWrap,
          {
            width: () => avatarsTargetWidth(),
            marginRight: () => avatarsGap(),
            duration: 0.9,
            ease: "osmo",
          },
          "avatarsIn",
        )
        .to(
          ideas,
          {
            x: 0,
            duration: 0.9,
            ease: "osmo",
          },
          "avatarsIn",
        )
        .to(
          avatars,
          {
            scale: 1,
            opacity: 1,
            duration: 0.55,
            stagger: 0.08,
            ease: "osmoSettle",
          },
          "avatarsIn+=0.12",
        );

      window.addEventListener("resize", () => {
        if (tl.progress() < 1) return;
        gsap.set(avatarsWrap, {
          width: avatarsTargetWidth(),
          marginRight: avatarsGap(),
        });
      });
    </script>
    <script src="./osmos-motion.js" defer></script>
</body>
</html>
