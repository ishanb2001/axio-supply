<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classic Tabs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f4f4f5;
        color: #111111;
        font-family: Inter, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px 20px;
      }

      .feature-filter {
        position: relative;
        width: fit-content;
        max-width: 100%;
        padding: 5px;
        overflow: visible;
        border-radius: 999px;
        background: #f2f2f2;
      }

      .feature-filter__backdrop {
        position: absolute;
        top: 5px;
        left: 0;
        width: 0;
        height: 0;
        border-radius: 999px;
        pointer-events: none;
        z-index: 0;
        background-color: #ffffff;
        will-change: left, width, height, top, background-color;
        transition: background-color 0.16s cubic-bezier(0.7, 0, 0.3, 1);
      }

      .feature-filter__backdrop.is-pressed {
        background-color: #f6f6f6;
      }

      .feature-filter__list {
        list-style: none;
        display: flex;
        width: max-content;
        margin: 0;
        padding: 0;
      }

      .feature-filter__item {
        position: relative;
        z-index: 1;
        padding: 10px 28px;
        cursor: pointer;
        user-select: none;
      }

      .feature-filter__title {
        margin: 0;
        font-size: 15px;
        font-weight: 500;
        color: #8a8a8a;
        letter-spacing: -0.02em;
        line-height: 1.15;
        white-space: nowrap;
      }

      .feature-filter__item.is-active .feature-filter__title {
        font-weight: 600;
        color: #111111;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="feature-filter feature-filter--classic" id="tabs">
        <div class="feature-filter__backdrop" aria-hidden="true"></div>
        <ul class="feature-filter__list" role="tablist" aria-label="Classic tabs">
          <li class="feature-filter__item is-active" data-id="all" role="tab">
            <h3 class="feature-filter__title">All</h3>
          </li>
          <li class="feature-filter__item" data-id="free" role="tab">
            <h3 class="feature-filter__title">Free</h3>
          </li>
          <li class="feature-filter__item" data-id="pro" role="tab">
            <h3 class="feature-filter__title">Pro</h3>
          </li>
        </ul>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/CustomEase.min.js"></script>
    <script>
      gsap.registerPlugin(CustomEase);
      CustomEase.create("tabPillEase", "M0,0 C0.7,0 0.3,1 1,1");

      const REST_TOP = 5;
      const TAB_EASE = "tabPillEase";
      const activeColor = "#111111";
      const inactiveColor = "#8a8a8a";
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const root = document.getElementById("tabs");
      const tabItems = gsap.utils.toArray(".feature-filter__item", root);
      const backdrop = root.querySelector(".feature-filter__backdrop");
      const bgPos = { left: 0, right: 0 };
      const size = { height: 0, top: REST_TOP };
      let moveTl;

      const renderBackdrop = () => {
        gsap.set(backdrop, {
          left: bgPos.left,
          width: Math.max(0, bgPos.right - bgPos.left),
          height: size.height,
          top: size.top,
        });
      };

      const sync = (item) => {
        bgPos.left = item.offsetLeft;
        bgPos.right = item.offsetLeft + item.offsetWidth;
        size.height = item.offsetHeight;
        size.top = REST_TOP;
        renderBackdrop();
      };

      const paintTitles = (target) => {
        tabItems.forEach((el) => {
          const title = el.querySelector(".feature-filter__title");
          gsap.to(title, {
            color: el === target ? activeColor : inactiveColor,
            duration: reduced ? 0 : 0.38,
            ease: TAB_EASE,
            overwrite: "auto",
          });
        });
      };

      const moveTo = (targetItem) => {
        if (reduced) {
          sync(targetItem);
          return;
        }

        const targetLeft = targetItem.offsetLeft;
        const targetRight = targetLeft + targetItem.offsetWidth;
        const isMovingRight = targetLeft > bgPos.left;

        moveTl?.kill();
        gsap.killTweensOf(bgPos);
        size.height = targetItem.offsetHeight;
        size.top = REST_TOP;

        if (isMovingRight) {
          gsap.to(bgPos, {
            right: targetRight,
            duration: 0.42,
            ease: TAB_EASE,
            onUpdate: renderBackdrop,
            overwrite: "auto",
          });
          gsap.to(bgPos, {
            left: targetLeft,
            duration: 0.55,
            ease: TAB_EASE,
            onUpdate: renderBackdrop,
            overwrite: "auto",
          });
        } else {
          gsap.to(bgPos, {
            left: targetLeft,
            duration: 0.42,
            ease: TAB_EASE,
            onUpdate: renderBackdrop,
            overwrite: "auto",
          });
          gsap.to(bgPos, {
            right: targetRight,
            duration: 0.55,
            ease: TAB_EASE,
            onUpdate: renderBackdrop,
            overwrite: "auto",
          });
        }
      };

      const setActiveClass = (target) => {
        tabItems.forEach((el) => el.classList.toggle("is-active", el === target));
        paintTitles(target);
      };

      sync(tabItems[0]);
      paintTitles(tabItems[0]);

      tabItems.forEach((item) => {
        item.addEventListener("click", () => {
          setActiveClass(item);
          moveTo(item);
        });
        item.addEventListener("pointerdown", () => backdrop.classList.add("is-pressed"));
        item.addEventListener("pointerup", () => backdrop.classList.remove("is-pressed"));
        item.addEventListener("pointercancel", () => backdrop.classList.remove("is-pressed"));
        item.addEventListener("pointerleave", () => backdrop.classList.remove("is-pressed"));
      });

      window.addEventListener("resize", () => {
        const active = tabItems.find((el) => el.classList.contains("is-active")) || tabItems[0];
        sync(active);
      });
    </script>
  </body>
</html>
