<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Float Tiles</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #ffffff;
      }

      .float {
        position: relative;
        width: min(380px, calc(100% - 48px));
        height: min(72vh, 560px);
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        overflow: hidden;
        mask-image: linear-gradient(
            to bottom,
            transparent 0%,
            #000 10%,
            #000 78%,
            transparent 100%
          ),
          linear-gradient(to right, #000 0%, #000 88%, transparent 100%);
        mask-composite: intersect;
        -webkit-mask-image: linear-gradient(
            to bottom,
            transparent 0%,
            #000 10%,
            #000 78%,
            transparent 100%
          ),
          linear-gradient(to right, #000 0%, #000 88%, transparent 100%);
        -webkit-mask-composite: source-in;
      }

      .float__col {
        display: flex;
        flex-direction: column;
        gap: 16px;
        will-change: transform;
      }

      .float__col--2 {
        margin-top: 72px;
      }

      .float__tile {
        width: 100%;
        flex-shrink: 0;
        border-radius: 22px;
        background: #ececee;
      }
    </style>
  </head>
  <body>
    <div class="float" aria-hidden="true">
      <div class="float__col float__col--1"></div>
      <div class="float__col float__col--2"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script>
      const TILES = [
        { col: 1, h: 160 },
        { col: 1, h: 210 },
        { col: 1, h: 140 },
        { col: 1, h: 180 },
        { col: 2, h: 190 },
        { col: 2, h: 150 },
        { col: 2, h: 220 },
        { col: 2, h: 130 },
      ];

      const col1 = document.querySelector(".float__col--1");
      const col2 = document.querySelector(".float__col--2");

      TILES.forEach((tile) => {
        const col = tile.col === 1 ? col1 : col2;
        const el = document.createElement("div");
        el.className = "float__tile";
        el.style.height = `${tile.h}px`;
        col.appendChild(el);
      });

      [col1, col2].forEach((col) => {
        col.innerHTML += col.innerHTML;
      });

      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!reduced) {
        gsap.fromTo(
          col1,
          { y: 0 },
          { y: -col1.scrollHeight / 2, duration: 18, ease: "none", repeat: -1 }
        );
        gsap.fromTo(
          col2,
          { y: -col2.scrollHeight / 2 },
          { y: 0, duration: 20, ease: "none", repeat: -1 }
        );
      }
    </script>
  </body>
</html>
