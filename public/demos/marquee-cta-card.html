<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marquee CTA Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f4f4f5;
        font-family: Inter, sans-serif;
      }

      .stage {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px 24px;
      }

      .map-card {
        position: relative;
        display: flex;
        align-items: center;
        width: min(360px, 100%);
        min-height: 240px;
        overflow: hidden;
        padding: 18px;
        border-radius: 28px;
        background: linear-gradient(180deg, #b7b4e8 0%, #eceaf8 100%);
      }

      .map-card__arrow {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 2;
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: #ffffff;
        color: #111111;
        cursor: pointer;
      }

      .map-card__arrow svg {
        width: 16px;
        height: 16px;
      }

      .map-card__headline {
        width: 100%;
        overflow: hidden;
        pointer-events: none;
      }

      .map-card__headline-track {
        display: flex;
        align-items: center;
        width: max-content;
        gap: 0.28em;
        will-change: transform;
      }

      .map-card__headline-track span {
        font-size: clamp(42px, 8vw, 64px);
        font-weight: 700;
        letter-spacing: -0.05em;
        line-height: 1;
        white-space: nowrap;
        color: #ffffff;
      }

      .map-card__pill {
        position: absolute;
        left: 16px;
        bottom: 16px;
        z-index: 2;
        margin: 0;
        display: inline-flex;
        align-items: center;
        padding: 8px 14px;
        border-radius: 999px;
        background: #ffffff;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: #111111;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <article class="map-card">
        <button class="map-card__arrow" type="button" aria-label="Open">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M7 17L17 7M17 7H9M17 7V15"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <div class="map-card__headline" aria-hidden="true">
          <div class="map-card__headline-track">
            <span>TOGETHER LET’S</span>
            <span>TOGETHER LET’S</span>
          </div>
        </div>
        <p class="map-card__pill">Get a 5-Day Trial for $9.00 USD •</p>
      </article>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script>
      const track = document.querySelector(".map-card__headline-track");
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (track && !reduced) {
        gsap.to(track, {
          x: -track.scrollWidth / 2,
          duration: 14,
          ease: "none",
          repeat: -1,
        });
      }
    </script>
  </body>
</html>
